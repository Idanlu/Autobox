name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: gradle test --stacktrace

      - name: Build Release and Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          
          echo "Determined release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Copy Release APK
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "release-artifacts/Autobox-${TAG}.apk"
          fi

          # Copy Debug APK
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "release-artifacts/Autobox-${TAG}-debug.apk"
          fi

          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag }}
          name: "Autobox ${{ steps.prepare_artifacts.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
          body: |
            ## 🚀 Autobox ${{ steps.prepare_artifacts.outputs.tag }} - First Official Release
            
            ### ✨ Key Features
            - **Sub-Millisecond Snipe Engine**: Automated high-precision booking trigger scheduled at $T-5\text{s}$ using `AlarmManager.setExactAndAllowWhileIdle()` and CPU `WakeLock`.
            - **Parallel Burst Dispatcher**: Executes concurrent parallel HTTP requests with microsecond latency calibration offsets.
            - **Background Schedule Sync**: `WorkManager` daily synchronization to automatically discover target sessions and arm system alarms.
            - **Reboot Resiliency**: `BootReceiver` restores and re-arms all exact alarms on device reboot.
            - **Jetpack Compose Dark UI**: Full schedule viewer, recurring rule manager, live audit execution logs, and battery optimization wizard.
            - **Encrypted Local Storage**: Zero external servers required; user credentials and bearer tokens stored securely via `EncryptedSharedPreferences` (AES-256 GCM).

            ### 📦 Downloads
            - **`Autobox-${{ steps.prepare_artifacts.outputs.tag }}.apk`** (Ready to install on Android 8.0+)
            - **`Autobox-${{ steps.prepare_artifacts.outputs.tag }}-debug.apk`** (Debug build with verbose logs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
